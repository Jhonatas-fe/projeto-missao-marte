name: Pipeline de Qualidade - Missão Marte

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  testes:
    name: Pytest + Mocks + Selenium + BDD
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # O Google Chrome já vem instalado no ubuntu-latest; o Selenium Manager
      # baixa o ChromeDriver compatível automaticamente.
      - name: Versão do Chrome
        run: google-chrome --version

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar a suíte completa com cobertura
        run: pytest -v --cov=src --cov-report=term-missing

      - name: Publicar screenshots das falhas E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-falhas-e2e
          path: screenshots/
          if-no-files-found: ignore
